<!doctypehtml><html lang=ru><meta charset=UTF-8><meta content="width=device-width,initial-scale=1"name=viewport><title>PROKOPOV</title><link href=https://fonts.googleapis.com rel=preconnect><link href=https://fonts.gstatic.com rel=preconnect crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;500;700&display=swap"rel=stylesheet><style>*{margin:0;padding:0;box-sizing:border-box}body,html{height:100%;background:#000;overflow:hidden;font-family:Montserrat,sans-serif;-webkit-font-smoothing:antialiased}#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}.stage{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.4rem}.name{position:relative;display:inline-block;font-size:clamp(1.8rem,5vw,4.5rem);font-weight:200;letter-spacing:.28em;text-transform:uppercase;text-decoration:none;color:rgba(255,255,255,.12);cursor:pointer;transition:color .5s ease,letter-spacing .6s ease;padding-left:.28em;will-change:color;z-index:1}.name::after{content:attr(data-text);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-left:.28em;font-size:inherit;font-weight:inherit;letter-spacing:inherit;text-transform:inherit;background:radial-gradient(circle 110px at var(--mx,50%) var(--my,50%),#fff 0,rgba(255,255,255,.7) 30%,transparent 65%);-webkit-background-clip:text;background-clip:text;color:transparent;pointer-events:none;opacity:0;transition:opacity .4s ease}.name:hover::after{opacity:1}.name:hover{letter-spacing:.32em}.contacts{display:flex;align-items:center;gap:.6rem;padding-left:.55em}.tag{font-size:clamp(.5rem,.9vw,.62rem);font-weight:300;letter-spacing:.5em;text-transform:uppercase;text-decoration:none;color:rgba(255,255,255,.35);transition:color .4s ease}.tag:hover{color:rgba(255,255,255,.75)}.mail{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:rgba(255,255,255,.35);text-decoration:none;opacity:0;transform:translateX(-6px) scale(.9);pointer-events:none;transition:opacity .35s ease,transform .35s ease,color .3s ease,background .3s ease}.contacts:hover .mail{opacity:1;transform:translateX(0) scale(1);pointer-events:auto}.mail:hover{color:#fff;background:rgba(255,255,255,.08)}.mail svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.4}.line{width:40px;height:1px;background:rgba(255,255,255,.18)}</style><canvas id=stars></canvas><div class=stage><a class=name href=https://t.me/Prokopov13 rel="noopener noreferrer"target=_blank data-text=PROKOPOV>PROKOPOV</a> <span class=line></span><div class=contacts><a class=tag href=https://t.me/Prokopov13 rel="noopener noreferrer"target=_blank>Telegram · @Prokopov13</a><a class=mail href=mailto:prokopovwork@mail.ru aria-label="Написать на email"><svg viewBox="0 0 24 24"><rect height=14 rx=2 width=18 x=3 y=5 /><path d="M3 7l9 6 9-6"/></svg></a></div></div><script>/* ================================================================
           1. ЗВЁЗДЫ
           ================================================================ */
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        let stars = [];
        const STAR_COUNT = 160;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            buildStars();
        }

        function buildStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 1.1 + 0.25,
                    a: Math.random() * 0.5 + 0.25,
                    speed: Math.random() * 0.8 + 0.3,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        let t = 0;
        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            t += 0.016;
            for (const s of stars) {
                const flicker = 0.65 + Math.sin(t * s.speed * 2 + s.phase) * 0.35;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${(s.a * flicker).toFixed(3)})`;
                ctx.fill();
            }
            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', resize);
        resize();
        loop();

        /* ================================================================
           2. ПОЗИЦИЯ ПЯТНА ЗА КУРСОРОМ
           ================================================================ */
        const nameEl = document.querySelector('.name');

        nameEl.addEventListener('mousemove', (e) => {
            const r = nameEl.getBoundingClientRect();
            const x = ((e.clientX - r.left) / r.width) * 100;
            const y = ((e.clientY - r.top) / r.height) * 100;
            nameEl.style.setProperty('--mx', x + '%');
            nameEl.style.setProperty('--my', y + '%');
        });

        nameEl.addEventListener('mouseleave', () => {
            nameEl.style.setProperty('--mx', '50%');
            nameEl.style.setProperty('--my', '50%');
        });</script>
